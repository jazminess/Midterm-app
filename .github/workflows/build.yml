[app]
title = Easy Physics
package.name = easyphysics
package.domain = org.jazminess

source.dir = .
source.include_exts = py,png,jpg,kv,atlas

version = 0.1
requirements = python3,kivy

android.accept_sdk_license = True

# Force Python 3.11 for the Android build (Kivy does not support 3.12+)
p4a.hostpython_version = 3.11.9
p4a.python_version = 3.11.9

orientation = portrait
fullscreen = 1

android.api = 33
android.minapi = 21
android.ndk = 25b
android.archs = arm64-v8a, armeabi-v7a

[buildozer]
log_level = 2
warn_on_root = 1
